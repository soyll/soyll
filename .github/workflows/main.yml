name: main

on:
  schedule:
    - cron: "0 */24 * * *" 
  
  workflow_dispatch:
  
  push:
    branches:
    - main
    
  

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: checkout main branch
        uses: actions/checkout@v4

      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: add seamless cell fade
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          style_re = re.compile(r'(<style[^>]*>)(.*?)(</style>)', re.S)

          for path in Path("dist").glob("*.svg"):
              svg = path.read_text()
              changed = 0

              def patch_style(match):
                  nonlocal_dummy = None
                  css = match.group(2)

                  colors = re.findall(
                      r'\.c\.(c\d+)\{fill:(var\(--c\d+\));animation-name:\1\}',
                      css
                  )

                  for name, color in colors:
                      pattern = re.compile(
                          r'(@keyframes ' + re.escape(name) + r'\{)(.*?)(\})'
                      )

                      def patch_keyframes(kf):
                          body = kf.group(2)

                          body, count = re.subn(
                              r',100%(\{fill:var\(--ce\)\})',
                              lambda m: f',95%{m.group(1)}100%{{fill:{color}}}',
                              body,
                              count=1
                          )

                          if count == 0:
                              body, count = re.subn(
                                  r'100%(\{fill:var\(--ce\)\})',
                                  lambda m: f'95%{m.group(1)}100%{{fill:{color}}}',
                                  body,
                                  count=1
                              )

                          return kf.group(1) + body + kf.group(3), count

                      css, count = pattern.subn(
                          lambda m: patch_keyframes(m)[0],
                          css,
                          count=1
                      )

                      changed += count

                  return match.group(1) + css + match.group(3)

              svg = style_re.sub(patch_style, svg)

              print(f"{path.name}: patched {changed} animations")
              assert changed > 0, "No animations were patched"

              path.write_text(svg)
          PY

      - name: remove progress bar
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          for path in Path("dist").glob("*.svg"):
              svg = path.read_text()

              svg, count = re.subn(
                  r'<rect\b[^>]*\bclass="u [^"]*"[^>]*/>',
                  '',
                  svg
              )

              print(f"{path.name}: removed {count} progress elements")
              assert count == 4, f"Expected 4 elements, got {count}"

              path.write_text(svg)
          PY

      - name: commit generated SVG files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake-dark.svg
          if git diff --cached --quiet; then
            echo "Generated SVG files are unchanged."
            exit 0
          fi
          git commit -m "Update contribution grid snake"
          git push