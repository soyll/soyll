name: main

on:
  schedule:
    - cron: "0 */24 * * *" 
  
  workflow_dispatch:
  
  push:
    branches:
    - main
    
  

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: checkout main branch
        uses: actions/checkout@v4

      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: add seamless cell fade
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          style_re = re.compile(r'(<style[^>]*>)(.*?)(</style>)', re.S)

          for path in Path("dist").glob("*.svg"):
              svg = path.read_text()
              stats = [0]

              def patch_style(match):
                  css = match.group(2)

                  colors = re.findall(
                      r'\.c\.(c\d+)\{fill:(var\(--c\d+\));animation-name:\1\}',
                      css
                  )

                  for name, color in colors:
                      pattern = re.compile(
                          r'(@keyframes ' + re.escape(name) +
                          r'\{.*?)(,\s*100%\{fill:var\(--ce\)\})(\})'
                      )

                      replacement = (
                          r'\1,95%{fill:var(--ce)}'
                          f'100%{{fill:{color}}}'
                          r'\3'
                      )

                      css, count = pattern.subn(
                          replacement,
                          css,
                          count=1
                      )

                      stats[0] += count

                  return match.group(1) + css + match.group(3)

              svg = style_re.sub(patch_style, svg)

              print(f"{path.name}: patched {stats[0]} animations")
              assert stats[0] > 0, "No animations were patched"

              path.write_text(svg)
          PY

      - name: remove progress bar
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          for path in Path("dist").glob("*.svg"):
              svg = path.read_text()

              svg, count = re.subn(
                  r'<rect\b[^>]*\bclass="u [^"]*"[^>]*/>',
                  '',
                  svg
              )

              print(f"{path.name}: removed {count} progress elements")
              assert count == 4, f"Expected 4 elements, got {count}"

              path.write_text(svg)
          PY

      - name: commit generated SVG files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake-dark.svg
          if git diff --cached --quiet; then
            echo "Generated SVG files are unchanged."
            exit 0
          fi
          git commit -m "Update contribution grid snake"
          git push