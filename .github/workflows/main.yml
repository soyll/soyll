name: main

on:
  schedule:
    - cron: "0 */24 * * *" 
  
  workflow_dispatch:
  
  push:
    branches:
    - main
    
  

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: checkout main branch
        uses: actions/checkout@v4

      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: diagnose cell animations
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          from collections import Counter

          for path in Path("dist").glob("*.svg"):
              svg = path.read_text()
              css = re.search(
                  r'<style[^>]*>(.*?)</style>',
                  svg,
                  re.S
              ).group(1)

              rects = re.findall(
                  r'<rect\b[^>]*class="([^"]*)"[^>]*/>',
                  svg
              )

              cells = [
                  classes.split()
                  for classes in rects
                  if "c" in classes.split()
              ]

              animated = set(re.findall(
                  r'\.c\.([\w-]+)\s*\{[^}]*animation-name\s*:\s*([\w-]+)',
                  css
              ))

              keyframes = set(re.findall(
                  r'@keyframes\s+([\w-]+)',
                  css
              ))

              cell_classes = Counter(
                  cls
                  for classes in cells
                  for cls in classes
                  if cls != "c"
              )

              missing = [
                  cls for cls in cell_classes
                  if not any(name == cls for name, _ in animated)
              ]

              print(f"\n===== {path.name} =====")
              print("Grid cells:", len(cells))
              print("Unique cell classes:", len(cell_classes))
              print("Animated classes:", len(animated))
              print("Keyframes:", len(keyframes))
              print("Classes without animation:", missing[:30])
              print("Total without animation:", len(missing))
          PY

      - name: add seamless cell fade
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          FADE_START = 99.0

          def get_block(text, start):
              brace = text.find("{", start)
              if brace == -1:
                  raise ValueError("Opening brace not found")

              depth = 0

              for i in range(brace, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1

                      if depth == 0:
                          return brace, i + 1

              raise ValueError("Unclosed CSS block")

          def patch_css(css):
              rules = re.findall(
                  r'\.c\.([a-zA-Z0-9_-]+)\s*\{([^{}]*)\}',
                  css
              )

              patched = 0
              skipped = []

              for cell_id, declarations in rules:
                  animation = re.search(
                      r'animation-name\s*:\s*([a-zA-Z0-9_-]+)',
                      declarations
                  )

                  color = re.search(
                      r'\bfill\s*:\s*(var\(--c[^)]+\))',
                      declarations
                  )

                  if not animation or not color:
                      continue

                  name = animation.group(1)
                  original_color = color.group(1)

                  marker = re.search(
                      r'@keyframes\s+' + re.escape(name) + r'\s*\{',
                      css
                  )

                  if not marker:
                      skipped.append(cell_id)
                      continue

                  brace, end = get_block(css, marker.start())
                  body = css[brace + 1:end - 1]

                  frames = list(
                      re.finditer(r'([^{}]+)\{([^{}]*)\}', body)
                  )

                  terminal = None

                  for frame in frames:
                      selectors = [
                          x.strip()
                          for x in frame.group(1).split(",")
                      ]

                      fill = re.search(
                          r'\bfill\s*:\s*var\(--ce\)',
                          frame.group(2)
                      )

                      if "100%" in selectors and fill:
                          terminal = frame
                          break

                  if terminal is None:
                      skipped.append(cell_id)
                      continue

                  selectors = [
                      x.strip()
                      for x in terminal.group(1).split(",")
                      if x.strip() != "100%"
                  ]

                  eat_times = [
                      float(x[:-1])
                      for x in selectors
                      if re.fullmatch(r'\d+(?:\.\d+)?%', x)
                  ]

                  eat_end = max(eat_times, default=0.0)

                  replacement = ""

                  if selectors:
                      replacement += (
                          ",".join(selectors) +
                          "{" + terminal.group(2) + "}"
                      )

                  if eat_end < FADE_START:
                      replacement += (
                          f"{FADE_START}%{{fill:var(--ce)}}"
                      )

                  replacement += (
                      f"100%{{fill:{original_color}}}"
                  )

                  new_body = (
                      body[:terminal.start()] +
                      replacement +
                      body[terminal.end():]
                  )

                  css = (
                      css[:brace + 1] +
                      new_body +
                      css[end - 1:]
                  )

                  patched += 1

              return css, patched, skipped

          style_re = re.compile(
              r'(<style[^>]*>)(.*?)(</style>)',
              re.S
          )

          for path in Path("dist").glob("*.svg"):
              svg = path.read_text()
              stats = {"patched": 0, "skipped": []}

              def process_style(match):
                  css, count, skipped = patch_css(match.group(2))

                  stats["patched"] += count
                  stats["skipped"].extend(skipped)

                  return match.group(1) + css + match.group(3)

              svg = style_re.sub(process_style, svg)

              print(f"\n{path.name}")
              print(f"Patched: {stats['patched']}")
              print(f"Skipped: {stats['skipped']}")

              assert stats["patched"] > 0, "No cells patched"
              assert not stats["skipped"], (
                  f"Some cells were skipped: {stats['skipped']}"
              )

              path.write_text(svg)
          PY

      - name: verify cell fade
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          for path in Path("dist").glob("*.svg"):
              css = re.search(
                  r'<style[^>]*>(.*?)</style>',
                  path.read_text(),
                  re.S
              ).group(1)

              print(f"\n===== {path.name} =====")

              for name in ("c0", "c1", "c2"):
                  match = re.search(
                      rf'@keyframes {name}\{{.*?\}}',
                      css
                  )
                  print(match.group(0) if match else f"{name}: NOT FOUND")
          PY

      - name: remove progress bar
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          for path in Path("dist").glob("*.svg"):
              svg = path.read_text()

              svg, count = re.subn(
                  r'<rect\b[^>]*\bclass="u [^"]*"[^>]*/>',
                  '',
                  svg
              )

              print(f"{path.name}: removed {count} progress elements")
              assert count == 4, f"Expected 4 elements, got {count}"

              path.write_text(svg)
          PY

      - name: commit generated SVG files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake-dark.svg
          if git diff --cached --quiet; then
            echo "Generated SVG files are unchanged."
            exit 0
          fi
          git commit -m "Update contribution grid snake"
          git push