name: main

on:
  schedule:
    - cron: "0 */24 * * *" 
  
  workflow_dispatch:
  
  push:
    branches:
    - main
    
  

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: checkout main branch
        uses: actions/checkout@v4

      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: add seamless cell fade
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          FADE_START = "99%"

          style_re = re.compile(r'(<style[^>]*>)(.*?)(</style>)', re.S)

          for path in Path("dist").glob("*.svg"):
              svg = path.read_text()
              stats = {"found": 0, "patched": 0}
              missing = []

              def patch_style(match):
                  css = match.group(2)

                  cells = re.findall(
                      r'\.c\.(c\d+)\s*\{[^}]*?'
                      r'\bfill:\s*(var\(--c\d+\))[^}]*?'
                      r'\banimation-name:\s*\1\b[^}]*\}',
                      css
                  )

                  stats["found"] += len(cells)

                  for name, color in cells:
                      start = css.find(f"@keyframes {name}{{")

                      if start == -1:
                          missing.append(name)
                          continue

                      next_start = css.find("@keyframes ", start + 1)
                      end = next_start if next_start != -1 else len(css)

                      segment = css[start:end]

                      terminal = re.compile(
                          r'(?P<previous>\d+(?:\.\d+)?%,)?'
                          r'100%\{fill:var\(--ce\)\}'
                      )

                      def restore(m):
                          previous = m.group("previous") or ""
                          return (
                              f"{previous}{FADE_START}{{fill:var(--ce)}}"
                              f"100%{{fill:{color}}}"
                          )

                      segment, count = terminal.subn(
                          restore,
                          segment,
                          count=1
                      )

                      if count:
                          css = css[:start] + segment + css[end:]
                          stats["patched"] += 1
                      else:
                          missing.append(name)

                  return match.group(1) + css + match.group(3)

              svg = style_re.sub(patch_style, svg)

              print(f"\n{path.name}")
              print(f"Found:   {stats['found']}")
              print(f"Patched: {stats['patched']}")
              print(f"Missing: {missing}")

              assert stats["found"] > 0, "No animated cells found"
              assert not missing, f"Some cells were not patched: {missing}"
              assert stats["found"] == stats["patched"], "Not all cells patched"

              path.write_text(svg)
          PY

      - name: verify cell fade
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          for path in Path("dist").glob("*.svg"):
              css = re.search(
                  r'<style[^>]*>(.*?)</style>',
                  path.read_text(),
                  re.S
              ).group(1)

              print(f"\n===== {path.name} =====")

              for name in ("c0", "c1", "c2"):
                  match = re.search(
                      rf'@keyframes {name}\{{.*?\}}',
                      css
                  )
                  print(match.group(0) if match else f"{name}: NOT FOUND")
          PY

      - name: remove progress bar
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          for path in Path("dist").glob("*.svg"):
              svg = path.read_text()

              svg, count = re.subn(
                  r'<rect\b[^>]*\bclass="u [^"]*"[^>]*/>',
                  '',
                  svg
              )

              print(f"{path.name}: removed {count} progress elements")
              assert count == 4, f"Expected 4 elements, got {count}"

              path.write_text(svg)
          PY

      - name: commit generated SVG files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake-dark.svg
          if git diff --cached --quiet; then
            echo "Generated SVG files are unchanged."
            exit 0
          fi
          git commit -m "Update contribution grid snake"
          git push