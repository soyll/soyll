name: main

on:
  schedule:
    - cron: "0 */24 * * *" 
  
  workflow_dispatch:
  
  push:
    branches:
    - main
    
  

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: checkout main branch
        uses: actions/checkout@v4

      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: add seamless cell fade
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          FADE_START = "99%"

          style_re = re.compile(r'(<style[^>]*>)(.*?)(</style>)', re.S)

          for path in Path("dist").glob("*.svg"):
              svg = path.read_text()
              stats = {"cells": 0, "patched": 0}
              missing = []

              def patch_style(match):
                  css = match.group(2)

                  cell_rules = re.findall(
                      r'\.c\.(c[\w-]+)\s*\{([^}]*)\}',
                      css
                  )

                  for name, declarations in cell_rules:
                      animation = re.search(
                          r'animation-name\s*:\s*([\w-]+)',
                          declarations
                      )
                      color = re.search(
                          r'(?<![-\w])fill\s*:\s*(var\(--c\d+\))',
                          declarations
                      )

                      if not animation or not color:
                          continue

                      animation_name = animation.group(1)
                      original_color = color.group(1)
                      stats["cells"] += 1

                      keyframe_re = re.compile(
                          r'@keyframes\s+' + re.escape(animation_name) +
                          r'\s*\{(.*?)(?=@keyframes\s+|\Z)',
                          re.S
                      )

                      keyframe = keyframe_re.search(css)

                      if not keyframe:
                          missing.append(name)
                          continue

                      body = keyframe.group(1)

                      terminal_re = re.compile(
                          r'((?:\s*\d+(?:\.\d+)?%\s*,\s*)*100%)'
                          r'\s*\{([^{}]*)\}'
                      )

                      def restore(m):
                          selectors = [
                              x.strip()
                              for x in m.group(1).split(",")
                              if x.strip() != "100%"
                          ]

                          result = ""

                          if selectors:
                              result += (
                                  ",".join(selectors) +
                                  "{" + m.group(2) + "}"
                              )

                          result += (
                              FADE_START + "{fill:var(--ce)}"
                              "100%{fill:" + original_color + "}"
                          )

                          return result

                      new_body, count = terminal_re.subn(
                          restore,
                          body,
                          count=1
                      )

                      if count:
                          css = (
                              css[:keyframe.start(1)] +
                              new_body +
                              css[keyframe.end(1):]
                          )
                          stats["patched"] += 1
                      else:
                          missing.append(name)

                  return match.group(1) + css + match.group(3)

              svg = style_re.sub(patch_style, svg)

              print(f"\n{path.name}")
              print(f"Animated cells: {stats['cells']}")
              print(f"Patched:        {stats['patched']}")
              print(f"Missing:        {missing}")

              assert stats["cells"] > 0, "No animated cells found"
              assert not missing, f"Unpatched cells: {missing}"
              assert stats["cells"] == stats["patched"]

              path.write_text(svg)
          PY

      - name: verify cell fade
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          for path in Path("dist").glob("*.svg"):
              css = re.search(
                  r'<style[^>]*>(.*?)</style>',
                  path.read_text(),
                  re.S
              ).group(1)

              print(f"\n===== {path.name} =====")

              for name in ("c0", "c1", "c2"):
                  match = re.search(
                      rf'@keyframes {name}\{{.*?\}}',
                      css
                  )
                  print(match.group(0) if match else f"{name}: NOT FOUND")
          PY

      - name: remove progress bar
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          for path in Path("dist").glob("*.svg"):
              svg = path.read_text()

              svg, count = re.subn(
                  r'<rect\b[^>]*\bclass="u [^"]*"[^>]*/>',
                  '',
                  svg
              )

              print(f"{path.name}: removed {count} progress elements")
              assert count == 4, f"Expected 4 elements, got {count}"

              path.write_text(svg)
          PY

      - name: commit generated SVG files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake-dark.svg
          if git diff --cached --quiet; then
            echo "Generated SVG files are unchanged."
            exit 0
          fi
          git commit -m "Update contribution grid snake"
          git push